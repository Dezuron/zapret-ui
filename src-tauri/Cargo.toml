[package]
name = "zapret-ui"
version = "1.2.4"
description = "Windows 11 GUI manager for flowseal-zapret (zapret-discord-youtube by Flowseal)"
authors = ["Dezuron"]
license = "MIT"
repository = "https://github.com/Dezuron/zapret-ui"
rust-version = "1.77"
edition = "2021"

[lib]
name = "zapret_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
getrandom = "0.2"
dirs = "5"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
