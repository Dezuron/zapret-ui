name: TG WS Proxy build

# Builds the headless Telegram proxy that zapret-ui downloads on demand.
# Upstream (Flowseal/tg-ws-proxy, MIT) ships a tray GUI for Windows; this
# workflow bundles its console entry point instead, so the app can supervise the
# process and drive it with CLI flags.
#
# Release tag format: tgws-v<upstream>-<revision>, e.g. tgws-v1.11.2-1.
# The app compares that tag against `tgws.installed_version` in config.json.

on:
  push:
    tags:
      - "tgws-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgws-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build headless tgws-cli (Windows 11)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout zapret-ui
        uses: actions/checkout@v7

      - name: Read upstream version from the tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^tgws-v(?<version>.+)$') {
            throw "Tag must look like tgws-v1.11.2-1, got '$tag'"
          }
          $version = $Matches['version']
          $upstream = ($version -split '-')[0]
          if ($upstream -notmatch '^\d+\.\d+\.\d+$') {
            throw "Cannot derive the upstream tag from '$version'"
          }
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          Add-Content $env:GITHUB_OUTPUT "upstream=$upstream"

      - name: Checkout upstream tg-ws-proxy
        uses: actions/checkout@v7
        with:
          repository: Flowseal/tg-ws-proxy
          ref: v${{ steps.meta.outputs.upstream }}
          path: upstream

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install upstream and PyInstaller
        working-directory: upstream
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller==6.11.1"

      - name: Build the headless binary
        shell: pwsh
        env:
          TGWS_UPSTREAM: ${{ github.workspace }}\upstream
        run: |
          pyinstaller --clean --noconfirm `
            --distpath tgws-artifacts `
            --workpath build/tgws `
            scripts/tgws/tgws-cli.spec
          Get-ChildItem tgws-artifacts | Format-Table Name, Length

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          $exe = "tgws-artifacts/tgws-cli-windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "tgws-cli-windows-x64.exe was not produced" }

          $help = Start-Process -FilePath $exe -ArgumentList "--help" -PassThru -NoNewWindow -Wait
          if ($help.ExitCode -ne 0) { throw "tgws-cli --help exited with $($help.ExitCode)" }

          # A real bind proves the frozen bundle resolves its network stack.
          $proxy = Start-Process -FilePath $exe -PassThru -NoNewWindow -ArgumentList @(
            "--port", "18777",
            "--secret", "00112233445566778899aabbccddeeff"
          )
          Start-Sleep -Seconds 5
          if ($proxy.HasExited) { throw "Proxy exited immediately with code $($proxy.ExitCode)" }
          $listening = Get-NetTCPConnection -LocalPort 18777 -State Listen -ErrorAction SilentlyContinue
          Stop-Process -Id $proxy.Id -Force
          if (-not $listening) { throw "Proxy did not listen on 127.0.0.1:18777" }

      - name: Write checksums
        shell: pwsh
        run: |
          $file = "tgws-artifacts/tgws-cli-windows-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  tgws-cli-windows-x64.exe" | Set-Content "tgws-artifacts/SHA256SUMS.txt"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: TG WS Proxy ${{ steps.meta.outputs.version }}
          body: |
            Headless CLI build of [Flowseal/tg-ws-proxy@v${{ steps.meta.outputs.upstream }}](https://github.com/Flowseal/tg-ws-proxy/releases/tag/v${{ steps.meta.outputs.upstream }}),
            built from the unmodified upstream sources with only the console entry point
            (`proxy.tg_ws_proxy:main`) bundled — no tray icon, no GUI dialogs.

            Used by [zapret-ui](https://github.com/Dezuron/zapret-ui). Upstream is MIT licensed;
            see `THIRD_PARTY_NOTICES.md` in this repository.
          files: |
            tgws-artifacts/tgws-cli-windows-x64.exe
            tgws-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
